# CI della Dashboard di Pistoia (Fase 0).
# lint → typecheck → unit test → drift delle migrazioni → build.
# Gli E2E Playwright girano in un job separato (non bloccante per ora).
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

env:
  # Valori fittizi sufficienti per build e test: nessun segreto reale in CI.
  DATABASE_URL: "file:./prisma/dev.db"
  SESSION_SECRET: "ci-only-secret-abcdefghijklmnopqrstuvwxyz012345"

defaults:
  run:
    working-directory: pistoia-dashboard

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pistoia-dashboard/package-lock.json

      - name: Installa dipendenze (esegue anche prisma generate)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test (Vitest)
        run: npm test

      # Audit delle dipendenze — traccia «Qualità continua».
      #
      # BLOCCANTE dal 2026-08-06. Fino al giorno prima era `npm audit || true`,
      # e la ragione era dichiarata: restavano avvisi che aspettavano una
      # decisione, e un cancello rosso per qualcosa che si è scelto di non
      # chiudere smette di essere letto. Quella ragione è caduta: la C-2 ha
      # portato l'audit da 12 a **zero**, e lo zero ha retto.
      #
      # `--audit-level=high` e non `npm audit` nudo: la soglia è sul CODICE DI
      # USCITA, non sul referto — il report esce comunque intero nei log, quindi
      # un avviso `moderate` resta VISIBILE senza far cadere la pipeline. È la
      # stessa logica del commento di prima, applicata al contrario: qui il
      # rosso deve significare «è successo qualcosa di serio», altrimenti smette
      # di essere letto anche questo.
      #
      # `--include=dev` è implicito e voluto: il Dockerfile fa
      # `npm ci --include=dev`, quindi le dipendenze di sviluppo finiscono
      # nell'immagine di produzione e vanno auditate come le altre.
      - name: Audit dipendenze
        run: npm audit --audit-level=high

      - name: Drift migrazioni (schema ↔ migrations)
        # exit 2 se lo schema diverge dalle migrazioni committate.
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Prepara database (migrate + seed)
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts

      - name: Build di produzione
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    # Non bloccante finché la suite non è stata rodata in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pistoia-dashboard/package-lock.json

      - name: Installa dipendenze
        run: npm ci

      - name: Prepara database (migrate + seed)
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: Test end-to-end
        run: npm run test:e2e

      - name: Carica il report in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pistoia-dashboard/playwright-report/
          retention-days: 7

  lighthouse:
    # Il nome diceva «misura, non giudica» ed era vero fino al 2026-08-06:
    # adesso giudica, e il documento non può restare indietro sul codice.
    name: Lighthouse (soglie misurate)
    runs-on: ubuntu-latest
    needs: quality
    # BLOCCANTE dal 2026-08-06. Era `continue-on-error: true` «finché non
    # esiste una soglia misurata»: adesso esiste, e sta in `lighthouserc.js`
    # con la tabella della prima misura vera accanto. Le soglie stanno cinque
    # punti sotto il minimo osservato, perché una soglia appoggiata al minimo
    # lampeggia al primo rumore della macchina condivisa.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pistoia-dashboard/package-lock.json

      - name: Installa dipendenze
        run: npm ci

      - name: Prepara database (migrate + seed)
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts

      # Si misura la build di produzione: in sviluppo il bundle non è
      # minificato e i numeri non somigliano a quelli di nessun cittadino.
      - name: Build di produzione
        run: npm run build

      # `@lhci/cli` NON è una dipendenza del progetto, ed è una scelta: porta
      # **285 pacchetti** (e cinque avvisi propri, fra cui `tmp` high) che il
      # `Dockerfile` si porterebbe in produzione, perché installa con
      # `npm ci --include=dev`. Uno strumento di misura che gira solo in CI non
      # deve entrare nell'immagine del servizio. La versione è **pinnata**:
      # `npx` senza versione scaricherebbe l'ultima, cioè codice non deciso.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      # I PUNTEGGI NEL LOG, e non è un di più: senza `assert` in
      # `lighthouserc.js`, `lhci autorun` si ferma a `collect` e **non stampa
      # nessuna tabella**. Fino al 2026-08-06 questo job girava, scriveva 12
      # referti sul disco, e non lasciava un solo numero leggibile da nessuna
      # parte — mentre si diceva «le soglie si scrivono dopo aver guardato le
      # prime passate». Non c'era niente da guardare.
      #
      # Legge il manifest e stampa la MEDIANA per URL, che è la corsa che
      # `lhci` marca `isRepresentativeRun`.
      - name: Punteggi (mediana delle tre passate)
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".lighthouseci/manifest.json", "utf8"));
            const pad = (s, n) => String(s).padEnd(n);
            console.log(pad("URL", 46) + ["perf", "a11y", "best", "seo"].map((h) => pad(h, 7)).join(""));
            for (const r of m.filter((x) => x.isRepresentativeRun)) {
              const s = r.summary;
              console.log(
                pad(r.url.replace("http://localhost:3000", ""), 46) +
                [s.performance, s.accessibility, s["best-practices"], s.seo]
                  .map((v) => pad(Math.round(v * 100), 7)).join("")
              );
            }
          '

      - name: Carica i referti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: pistoia-dashboard/.lighthouseci/
          # ⚠️ SENZA QUESTA RIGA NON SI CARICA NIENTE, e il job dice «success».
          # `.lighthouseci` comincia con un punto, e da `upload-artifact@v4.4`
          # i file nascosti sono esclusi per default: il passo si limitava a un
          # `##[warning] No files were found`, che in un log da 400 righe non lo
          # legge nessuno. Verificato sulla passata del 2026-08-05: dodici
          # referti scritti, zero caricati, esito verde.
          include-hidden-files: true
          retention-days: 7
